        :root {
            --bg-body: linear-gradient(180deg, #FAD7A1 0%, #E9E1F8 40%, #FFFFFF 100%);

        html.dark {
            --bg-body: linear-gradient(180deg, #2C1A14 0%, #151623 30%, #0B0D13 100%);

        body {
            background: var(--bg-body);
            background-attachment: fixed;
            color: #374151;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            transition: background 0.5s ease-in-out;
        }
        
        .dark body {
            color: #E5E7EB;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        html.dark ::-webkit-scrollbar-thumb { background: #374151; }

        @keyframes drop-bounce {
            0% { transform: translateY(-100px); opacity: 0; }
            15% { transform: translateY(0); opacity: 1; }
            20% { transform: translateY(-8px); }
            25%, 100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes mascot-slide {
            0%, 15% { transform: translateX(120px) translateY(10px) rotate(15deg); opacity: 0; }
            30%, 75% { transform: translateX(0) translateY(0) rotate(0deg); opacity: 1; }
            85%, 100% { transform: translateX(120px) translateY(10px) rotate(-15deg); opacity: 0; }
        }
        @keyframes arm-pull {
            0%, 40% { transform: translate(0px, 0px); }
            55% { transform: translate(8px, 5px); }
            60%, 100% { transform: translate(0px, 0px); }
        }
        @keyframes stone-fire {
            0%, 55% { transform: translate(0, 0) scale(0); opacity: 0; }
            56% { transform: translate(0, 0) scale(1); opacity: 1; }
            63% { transform: translate(-45px, -70px) scale(1); opacity: 1; }
            64%, 100% { opacity: 0; transform: translate(-45px, -70px) scale(0); }
        }
        @keyframes bulb-break {
            0%, 63% { opacity: 1; }
            64%, 100% { opacity: 0; }
        }
        @keyframes shatter-explode {
            0%, 63% { opacity: 0; transform: scale(0.5); }
            64% { opacity: 1; transform: scale(1); }
            80%, 100% { opacity: 0; transform: scale(1.5); }
        }

        .anim-drop-bounce { animation: drop-bounce 2.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .anim-mascot-slide { animation: mascot-slide 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; transform-origin: bottom center; }
        .anim-arm-pull { animation: arm-pull 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .anim-stone-fire { animation: stone-fire 2.5s linear forwards; }
        .anim-bulb-glass { animation: bulb-break 2.5s linear forwards; }
        .anim-shatter { animation: shatter-explode 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; transform-origin: center; }
    </style>
</head>

        const DarkModeAnimation = () => (
            <div className="absolute top-full right-0 mt-2 w-64 h-48 pointer-events-none z-50 overflow-visible">
                <div className="absolute top-4 right-20 anim-drop-bounce">
                    <svg className="w-12 h-12 text-yellow-400 fill-current anim-bulb-glass drop-shadow-md" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1">
                        <path d="M9 18h6 M10 22h4 M12 2v2 M4.9 4.9l1.4 1.4 M19.1 4.9l-1.4 1.4 M2 12h2 M20 12h2 M12 22a7.5 7.5 0 0 0 5-12.6V8a5 5 0 0 0-10 0v1.4A7.5 7.5 0 0 0 12 22z"/>

                    <svg className="w-16 h-16 text-yellow-200 absolute -top-2 -left-2 opacity-0 anim-shatter" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round">

        const ElegantCard = ({ children, className = "" }) => (
            <div className={`bg-white dark:bg-darkCard rounded-4xl p-8 md:p-10 shadow-soft dark:shadow-soft-dark border border-gray-100 dark:border-gray-800 relative overflow-hidden transition-colors duration-300 ${className}`}>
                {children}
            </div>
        );

        function App() {
            const [inputValue, setInputValue] = useState('');
            const [analysisData, setAnalysisData] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [isAnimatingDark, setIsAnimatingDark] = useState(false);
            const [recentSearches, setRecentSearches] = useState(["RELIANCE", "TATAMOTORS.NS", "HDFCBANK", "INFY", "NVDA"]);

            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            const handleThemeToggle = () => {
                if (!isDarkMode) {
                    setIsAnimatingDark(true);
                    setTimeout(() => {
                        setIsDarkMode(true);
                    }, 1600);
                    setTimeout(() => {
                        setIsAnimatingDark(false);
                    }, 2500);
                } else {
                    setIsDarkMode(false);
                }
            };

            const triggerSearch = async (term) => {
                const query = term.trim().toUpperCase();
                if (!query) return;

                setInputValue(query);
                setIsLoading(true);
                setAnalysisData(null);

                setRecentSearches(prev => {
                    const filtered = prev.filter(item => item !== query);
                    return [query, ...filtered].slice(0, 5);
                });

                if (!supabase) {
                    console.warn("Supabase client is not configured.");
                    setIsLoading(false);
                    return;
                }

                try {
                    // 1. Direct hit check on recent analyses
                    const { data: cachedRows } = await supabase
                        .from('analyses')
                        .select('*')
                        .ilike('ticker', `%${query}%`)
                        .order('id', { ascending: false })
                        .limit(1);

                    if (cachedRows && cachedRows.length > 0) {
                        const item = cachedRows[0];
                        setAnalysisData({
                            ticker: item.ticker,
                            exchange: item.ticker.endsWith('.NS') ? 'NSE' : item.ticker.endsWith('.BO') ? 'BSE' : 'GLOBAL',
                            fullName: item.ticker,
                            price: item.price || '₹0.00',
                            change: '+0.0%',
                            sentiment: item.sentiment || 'Neutral',
                            sentimentScore: item.sentiment_score || 50,
                            summary: item.synthesis || 'Synthesis available.',
                            bearCase: 'Market volatility and sector fundamentals remain key watchpoints.',
                            blastRadius: [],
                            lastUpdated: 'Cached'
                        });
                        setIsLoading(false);
                        return;
                    }

                    // 2. Queue the search request
                    const { data: requestRow, error: insertError } = await supabase
                        .from('search_requests')
                        .insert([{ ticker: query, status: 'pending' }])
                        .select()
                        .single();

                    if (insertError || !requestRow) {
                        throw new Error(insertError?.message || 'Failed to queue request');
                    }

                    const requestId = requestRow.id;

                    // 3. Poll for worker completion (every 3s, timeout after 2 mins)
                    let attempts = 0;
                    const maxAttempts = 40;

                    const pollInterval = setInterval(async () => {
                        attempts++;

                        const { data: statusCheck, error: pollError } = await supabase
                            .from('search_requests')
                            .select('status, resolved_ticker')
                            .eq('id', requestId)
                            .single();

                        if (pollError || !statusCheck) {
                            clearInterval(pollInterval);
                            setIsLoading(false);
                            return;
                        }

                        if (statusCheck.status === 'completed') {
                            clearInterval(pollInterval);

                            const targetTicker = statusCheck.resolved_ticker || query;
                            const { data: analysisRows } = await supabase
                                .from('analyses')
                                .select('*')
                                .eq('ticker', targetTicker)
                                .order('id', { ascending: false })
                                .limit(1);

                            if (analysisRows && analysisRows.length > 0) {
                                const finalItem = analysisRows[0];
                                setAnalysisData({
                                    ticker: finalItem.ticker,
                                    exchange: finalItem.ticker.endsWith('.NS') ? 'NSE' : finalItem.ticker.endsWith('.BO') ? 'BSE' : 'GLOBAL',
                                    fullName: statusCheck.resolved_ticker || finalItem.ticker,
                                    price: finalItem.price || '₹0.00',
                                    change: '+0.0%',
                                    sentiment: finalItem.sentiment || 'Neutral',
                                    sentimentScore: finalItem.sentiment_score || 50,
                                    summary: finalItem.synthesis || 'Synthesis completed.',
                                    bearCase: 'Macro adjustments and operational risks apply.',
                                    blastRadius: [],
                                    lastUpdated: 'Just now'
                                });
                            }
                            setIsLoading(false);
                        } else if (statusCheck.status === 'failed' || attempts >= maxAttempts) {
                            clearInterval(pollInterval);
                            setIsLoading(false);
                            alert(statusCheck.status === 'failed' 
                                ? 'Could not resolve equity symbol.' 
                                : 'Analysis timed out. Worker may still be running.');
                        }
                    }, 3000);

                } catch (err) {
                    console.error('Search queue error:', err);
                    setIsLoading(false);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') triggerSearch(inputValue);
            };

            const getSentimentColor = (sentiment) => {
                if (sentiment === "Bullish") return "text-emerald-600 dark:text-emerald-400";
                if (sentiment === "Bearish") return "text-red-600 dark:text-red-400";
                return "text-gray-500 dark:text-gray-400";
            };

            return (
                <div className="min-h-screen flex flex-col p-4 md:p-6 transition-colors duration-500">
                    
                    {/* Header */}
                    <header className="bg-white/80 dark:bg-darkCard/80 backdrop-blur-md rounded-full px-6 py-3 flex justify-between items-center shadow-sm dark:shadow-none max-w-7xl mx-auto w-full border border-gray-100/50 dark:border-gray-800 relative z-10 transition-colors duration-300">
                        <div className="flex items-center gap-2 font-bold text-2xl tracking-tight text-navy dark:text-white">
                            <HistoricAnnaLogo className="w-9 h-9 text-orange-600 dark:text-gold" />
                            <span>insight<span className="font-light">fin</span></span>
                        </div>
                        <div className="hidden md:flex gap-8 text-sm font-medium text-gray-600 dark:text-gray-300">

                            <a href="#" className="hover:text-navy dark:hover:text-white transition">Research</a>
                            <a href="#" className="hover:text-navy dark:hover:text-white transition">Company</a>
                        </div>
                        <div className="flex items-center gap-3">
                            {/* Dark Mode Toggle */}
                            <div className="relative">
                                <button 
                                    onClick={handleThemeToggle}
                                    disabled={isAnimatingDark}
                                    className="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full transition-colors relative z-20"
                                    aria-label="Toggle Dark Mode"
                                >
                                    {isDarkMode ? <IconSun className="w-5 h-5"/> : <IconMoon className="w-5 h-5"/>}
                                </button>
                                
                                {isAnimatingDark && <DarkModeAnimation />}
                            </div>
                            
                            <button className="hidden sm:block text-navy dark:text-white font-medium px-4 py-2 text-sm hover:bg-gray-50 dark:hover:bg-gray-800 rounded-full transition">Log in</button>
                            <button className="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-sm text-navy dark:text-white font-medium px-5 py-2 rounded-full text-sm hover:shadow-md transition">Contact</button>
                        </div>
                    </header>

                    {/* Main Content */}
                    <div className={`flex-grow flex flex-col items-center transition-all duration-700 ease-in-out w-full max-w-6xl mx-auto ${analysisData || isLoading ? 'mt-12' : 'mt-[15vh]'}`}>
                        
                        {/* Hero */}
                        {(!analysisData && !isLoading) && (
                            <div className="text-center mb-12 animate-fade-up">
                                <div className="text-orange-600 dark:text-gold mb-2 transition-colors">
                                    <AncientOrnament />
                                </div>
                                <h2 className="text-sm font-medium tracking-wide text-gray-500 dark:text-gray-400 uppercase mb-4">India's Sovereign Financial Intel</h2>
                                <h1 className="text-5xl md:text-7xl font-serif text-navy dark:text-white mb-6 tracking-tight transition-colors">
                                    Clarity for all investors
                                </h1>
                                <p className="text-lg text-gray-600 dark:text-gray-300 max-w-2xl mx-auto font-light leading-relaxed">
                                    Built on local context. Powered by frontier-class models.<br/>
                                    Delivering population-scale market impact.
                                </p>
                            </div>
                        )}

                        {/* Search Bar */}
                        <div className="w-full max-w-3xl animate-fade-up" style={{ animationDelay: '0.1s' }}>
                            <div className="bg-white dark:bg-darkCard p-2 rounded-full flex items-center shadow-soft dark:shadow-soft-dark border border-gray-100 dark:border-gray-800 focus-within:ring-4 ring-orange-500/10 dark:ring-gold/10 transition-all">
                                <div className="pl-6 pr-4 text-gray-400 dark:text-gray-500"><Rupee1983Coin className="w-7 h-7"/></div>
                                <input 
                                    type="text" 
                                    value={inputValue}
                                    onChange={(e) => setInputValue(e.target.value)}
                                    onKeyDown={handleKeyDown}
                                    placeholder="Enter stock name or ticker (e.g., TATAMOTORS, RELIANCE, NVDA)"
                                    className="flex-grow bg-transparent text-navy dark:text-white text-lg md:text-xl focus:outline-none font-medium placeholder:text-gray-400 dark:placeholder:text-gray-600 placeholder:font-light"
                                />
                                <button 
                                    onClick={() => triggerSearch(inputValue)}
                                    className="bg-navy dark:bg-white text-white dark:text-navy px-8 py-4 rounded-full text-base font-medium tracking-wide hover:opacity-90 transition-opacity shadow-md"
                                >
                                    Analyze
                                </button>
                            </div>

                            {/* Recent Searches */}
                            <div className="mt-6 flex flex-wrap items-center justify-center gap-2 px-4">
                                <span className="text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider flex items-center gap-1 mr-2">
                                    <IconClock className="w-3 h-3" /> Recent
                                </span>
                                {recentSearches.map((stock, idx) => (
                                    <button 
                                        key={idx}
                                        onClick={() => triggerSearch(stock)}
                                        className="text-sm font-medium text-navy/70 dark:text-gray-300 hover:text-navy dark:hover:text-white bg-white/50 dark:bg-darkCard/50 backdrop-blur-sm border border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600 px-4 py-1.5 rounded-full transition-all shadow-sm"
                                    >
                                        {stock}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Loading State */}
                        {isLoading && (
                            <div className="mt-20 text-center animate-fade-up">
                                <div className="inline-block animate-spin mb-4 text-orange-500 dark:text-gold">
                                    <HistoricAnnaLogo className="w-12 h-12" />
                                </div>
                                <p className="text-navy dark:text-white font-serif text-xl italic">Synthesizing market context via Mudra AI...</p>
                            </div>
                        )}

                        {/* Dashboard Analysis View */}
                        {analysisData && !isLoading && (
                            <div className="w-full mt-16 animate-fade-up" style={{ animationDelay: '0.2s' }}>
                                
                                {/* Stock Header */}
                                <div className="text-center mb-10">
                                    <div className="inline-flex items-center justify-center gap-2 mb-2">
                                        <h2 className="text-4xl font-serif text-navy dark:text-white">{analysisData.ticker}</h2>
                                        <span className="text-xs font-bold text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded-md border border-gray-200 dark:border-gray-700">{analysisData.exchange}</span>
                                    </div>
                                    <p className="text-gray-500 dark:text-gray-400 font-medium">{analysisData.fullName}</p>
                                    <div className="flex items-center justify-center gap-4 mt-4">
                                        <span className="text-3xl font-bold text-navy dark:text-white tracking-tight">{analysisData.price}</span>
                                        <span className={`text-lg font-semibold flex items-center ${getSentimentColor(analysisData.sentiment)}`}>
                                            {analysisData.change.startsWith('+') ? <IconTrendingUp className="w-5 h-5 mr-1"/> : <IconTrendingDown className="w-5 h-5 mr-1"/>}
                                            {analysisData.change}
                                        </span>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-[2fr,1fr] gap-6">
                                    {/* Primary AI Synthesis Card */}
                                    <ElegantCard>
                                        <CornerMotif />
                                        <HistoricAnnaLogo className="absolute -bottom-16 -right-16 w-64 h-64 text-gray-100 dark:text-gray-800 opacity-30 pointer-events-none" />
                                        
                                        <div className="relative z-10">
                                            <h3 className="text-sm font-bold tracking-widest text-gray-400 dark:text-gray-500 uppercase mb-6 flex items-center gap-2">
                                                <span className="w-2 h-2 rounded-full bg-orange-500 dark:bg-gold"></span>
                                                Sovereign Synthesis
                                            </h3>
                                            <p className="text-2xl font-serif text-navy dark:text-white leading-relaxed mb-8">
                                                {analysisData.summary}
                                            </p>
                                            
                                            <div className="pt-6 border-t border-gray-100 dark:border-gray-800 flex justify-between items-center">
                                                <div className="flex items-center gap-3">
                                                    <div className="text-sm text-gray-500 dark:text-gray-400">AI Sentiment:</div>
                                                    <div className={`px-3 py-1 rounded-full text-sm font-bold bg-gray-50 dark:bg-gray-800/50 border border-transparent dark:border-gray-700 ${getSentimentColor(analysisData.sentiment)}`}>
                                                        {analysisData.sentiment} ({analysisData.sentimentScore}/100)
                                                    </div>
                                                </div>
                                                <div className="text-xs text-gray-400 dark:text-gray-500 font-medium">Updated {analysisData.lastUpdated}</div>
                                            </div>
                                        </div>
                                    </ElegantCard>

                                    {/* Bear Case Card */}
                                    <div className="bg-white/40 dark:bg-darkCard/40 backdrop-blur-xl border border-white/50 dark:border-white/10 rounded-4xl p-8 md:p-10 shadow-soft dark:shadow-soft-dark relative overflow-hidden transition-colors duration-300 flex flex-col justify-center">
                                        <JharokhaMotif className="absolute -bottom-10 -right-10 w-64 h-64 text-orange-900 dark:text-amber-500 opacity-[0.03] dark:opacity-[0.05] pointer-events-none" />
                                        
                                        <div className="relative z-10">
                                            <h3 className="text-sm font-bold tracking-widest text-orange-800/80 dark:text-amber-500/90 uppercase mb-6 flex items-center gap-2">
                                                <span className="w-2 h-2 rounded-full bg-orange-600 dark:bg-amber-500 shadow-[0_0_8px_rgba(249,115,22,0.8)]"></span>
                                                The Counter-Thesis
                                            </h3>
                                            <p className="text-lg font-serif text-gray-800 dark:text-gray-200 leading-relaxed font-medium">
                                                {analysisData.bearCase}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Footer */}
                    <footer className="mt-20 pt-8 pb-4 text-center">
                        <div className="flex justify-center items-center gap-2 mb-4">
                            <HistoricAnnaLogo className="w-5 h-5 text-gray-300 dark:text-gray-600" />
                            <p className="text-[10px] text-gray-400 dark:text-gray-500 font-medium tracking-widest uppercase m-0">India builds with InsightFin</p>
                            <HistoricAnnaLogo className="w-5 h-5 text-gray-300 dark:text-gray-600" />
                        </div>
                        <p className="text-xs text-gray-500 dark:text-gray-600 max-w-3xl mx-auto font-light leading-relaxed">
                            Outputs are generated by AI parsing publicly available news. This platform is for educational and research purposes exclusively. We are not a SEBI Registered Investment Advisor.
                        </p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
