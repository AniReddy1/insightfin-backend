steps:
  # Step 1: Grab your files from the repository
  - name: Checkout Repository
    uses: actions/checkout@v4

  # Step 2: Install Python on the GitHub server
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  # Step 3: Install Pandas, Groq, Gemini, etc. (from your requirements.txt)
  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  # Step 4: Run the actual script, pulling keys securely from GitHub Secrets
  - name: Run Mudra AI Engine
    env:
      NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    run: python worker.py
